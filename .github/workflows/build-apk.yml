name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Generar íconos y pantalla de carga
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#1a9bd7" --splashBackgroundColor "#0d0f14" --splashBackgroundColorDark "#0d0f14"
        continue-on-error: true

      - name: Horizontal, pantalla completa y vibración
        run: python3 scripts/ajustes_android.py

      - name: Sincronizar web con Android
        run: npx cap sync android

      - name: Usar firma fija (permite actualizar sin desinstalar)
        run: mkdir -p ~/.android && cp firma/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk IslaVoxel.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: IslaVoxel-apk
          path: IslaVoxel.apk
